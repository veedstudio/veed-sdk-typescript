# Code generated from the VEED OpenAPI spec. DO NOT EDIT.

name: Release

# The tag is the release: it is pushed only after the SDK factory has already
# run this SDK's suite against freshly rendered output.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  npm:
    name: npm publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history of every branch: the ancestry check below needs the tag
          # and main to share one, and this is what leaves origin/main behind.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Matching the manifest to the tag name proves nothing about the tree.
      - name: Check the tag is on main
        run: |
          set -euo pipefail
          # No fetch: checkout dropped its credentials, and the refs are here.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main; refusing to publish"
            exit 1
          fi
      - name: Check package.json matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::package.json says $version, tag says $tag"
            exit 1
          fi
      # install, not ci: no lockfile. --ignore-scripts: a hook here shares the
      # workspace with the publish below and could rewrite dist/.
      - run: npm install --ignore-scripts
      - run: npm run build
      # No --provenance: it requires a public repository, and this one is internal.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
